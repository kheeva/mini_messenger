services:
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    image: mini_messenger-auth:local
    container_name: mini_messenger-auth
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8000"]
      interval: 10s
      timeout: 3s
      retries: 3
  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    image: mini_messenger-gateway:local
    container_name: mini_messenger-gateway
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
networks:
  default:
    name: mini_messenger
